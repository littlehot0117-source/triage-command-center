<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="8" />

  <!-- Inner Outer Circle -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-dasharray="10 15" opacity="0.4" />

  <!-- Outer Glow Hexagon/Shield -->
  <path d="M 256,70 L 416,160 L 416,352 L 256,442 L 96,352 L 96,160 Z" fill="none" stroke="url(#primaryGrad)" stroke-width="12" filter="url(#glow)" stroke-linejoin="round" />

  <!-- Heartbeat line (ECG pulse) -->
  <path d="M 120,256 L 190,256 L 210,200 L 235,320 L 255,230 L 270,280 L 285,256 L 392,256" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Red cross emblem in bottom right -->
  <g transform="translate(320, 320) scale(0.65)" filter="url(#glow)">
    <circle cx="90" cy="90" r="70" fill="#0f172a" stroke="url(#primaryGrad)" stroke-width="8" />
    <!-- Cross -->
    <path d="M 90,45 L 90,135 M 45,90 L 135,90" fill="none" stroke="url(#primaryGrad)" stroke-width="24" stroke-linecap="square" />
  </g>
  
  <!-- Ambulance Emblem top left -->
  <g transform="translate(100, 100) scale(0.7)">
    <circle cx="60" cy="60" r="55" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="8" />
    <!-- Ambulance Silhouette -->
    <path d="M 30,70 L 30,45 A 5,5 0 0 1 35,40 L 68,40 A 5,5 0 0 1 73,43 L 88,58 A 5,5 0 0 1 90,62 L 90,70 Z" fill="none" stroke="url(#accentGrad)" stroke-width="6" />
    <circle cx="45" cy="73" r="8" fill="url(#accentGrad)" />
    <circle cx="75" cy="73" r="8" fill="url(#accentGrad)" />
    <!-- Red light on top -->
    <line x1="50" y1="40" x2="50" y2="34" stroke="url(#primaryGrad)" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>
